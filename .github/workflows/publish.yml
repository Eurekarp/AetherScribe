name: Publish AetherScribe to Dalamud

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-feed:
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and publish release package
        shell: pwsh
        run: |
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $release = $event.release
          $asset = $release.assets | Where-Object { $_.name -eq "latest.zip" } | Select-Object -First 1

          if (-not $asset) {
            throw "Release must contain an asset named latest.zip."
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ".\latest.zip"

          $extract = Join-Path $env:RUNNER_TEMP "aetherscribe-release"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          New-Item -ItemType Directory -Path $extract | Out-Null
          Expand-Archive ".\latest.zip" -DestinationPath $extract -Force

          $dll = Get-ChildItem $extract -Recurse -File -Filter "AetherScribe.dll" | Select-Object -First 1
          $manifestFile = Get-ChildItem $extract -Recurse -File -Filter "AetherScribe.json" | Select-Object -First 1

          if (-not $dll -or -not $manifestFile) {
            throw "latest.zip must contain AetherScribe.dll and AetherScribe.json."
          }

          $manifest = Get-Content $manifestFile.FullName -Raw | ConvertFrom-Json
          if ($manifest.InternalName -ne "AetherScribe") {
            throw "The package manifest InternalName must be AetherScribe."
          }

          $manifest | Add-Member -NotePropertyName RepoUrl -NotePropertyValue "https://github.com/Eurekarp/AetherScribe" -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkInstall -NotePropertyValue "https://github.com/Eurekarp/AetherScribe/releases/latest/download/latest.zip" -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkUpdate -NotePropertyValue "https://github.com/Eurekarp/AetherScribe/releases/latest/download/latest.zip" -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkTesting -NotePropertyValue $null -Force
          $manifest | Add-Member -NotePropertyName LastUpdate -NotePropertyValue ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()) -Force
          $manifest | Add-Member -NotePropertyName IsHide -NotePropertyValue $false -Force

          $feed = @(Get-Content ".\repo.json" -Raw | ConvertFrom-Json)
          $feed = @($feed | Where-Object { $_.InternalName -ne "AetherScribe" })
          $feed += $manifest

          $json = ConvertTo-Json -InputObject $feed -Depth 100
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "repo.json"),
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Publish AetherScribe $($manifest.AssemblyVersion) to Dalamud feed"
          git push origin main
